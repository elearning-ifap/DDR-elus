<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Les cinq dimensions du risque</title><desc id="desc">Une situation sensible peut mobiliser plusieurs dimensions à la fois.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="18" fill="#F8BB00"/><text x="90" y="92" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#2F4354" text-anchor="start">Les cinq dimensions du risque</text><text x="90" y="138" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#647583" text-anchor="start">Une situation sensible peut mobiliser plusieurs dimensions à la fois.</text><line x1="90" y1="164" x2="1510" y2="164" stroke="#DCE3E8" stroke-width="2"/><line x1="520" y1="475" x2="520.0" y2="235.0" stroke="#DCE3E8" stroke-width="4" stroke-dasharray="8 10"/><circle cx="520.0" cy="235.0" r="58" fill="#2F4354"/><line x1="520" y1="475" x2="748.2535639108369" y2="400.83592135001265" stroke="#DCE3E8" stroke-width="4" stroke-dasharray="8 10"/><circle cx="748.2535639108369" cy="400.83592135001265" r="58" fill="#B4453A"/><line x1="520" y1="475" x2="661.0684605501935" y2="669.1640786499875" stroke="#DCE3E8" stroke-width="4" stroke-dasharray="8 10"/><circle cx="661.0684605501935" cy="669.1640786499875" r="58" fill="#2E7D52"/><line x1="520" y1="475" x2="378.93153944980645" y2="669.1640786499875" stroke="#DCE3E8" stroke-width="4" stroke-dasharray="8 10"/><circle cx="378.93153944980645" cy="669.1640786499875" r="58" fill="#58788F"/><line x1="520" y1="475" x2="291.7464360891631" y2="400.83592135001265" stroke="#DCE3E8" stroke-width="4" stroke-dasharray="8 10"/><circle cx="291.7464360891631" cy="400.83592135001265" r="58" fill="#B07F00"/><circle cx="520" cy="475" r="118" fill="#2F4354"/><text x="520" y="459" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle">UNE SITUATION</text><text x="520" y="499" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">SENSIBLE</text><rect x="900" y="215" width="590" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><rect x="900" y="215" width="10" height="100" rx="5" fill="#2F4354"/><text x="930" y="249" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2F4354" text-anchor="start">Administrative</text><text x="930" y="281" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="start"><tspan x="930" dy="0">Décision ou procédure fragilisée.</tspan></text><rect x="900" y="327" width="590" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><rect x="900" y="327" width="10" height="100" rx="5" fill="#B4453A"/><text x="930" y="361" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#B4453A" text-anchor="start">Pénale</text><text x="930" y="393" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="start"><tspan x="930" dy="0">Qualification à apprécier selon les faits et les critères</tspan><tspan x="930" dy="26">applicables.</tspan></text><rect x="900" y="439" width="590" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><rect x="900" y="439" width="10" height="100" rx="5" fill="#2E7D52"/><text x="930" y="473" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2E7D52" text-anchor="start">Déontologique</text><text x="930" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="start"><tspan x="930" dy="0">Impartialité, exemplarité ou règles internes peuvent être</tspan><tspan x="930" dy="26">mises en cause.</tspan></text><rect x="900" y="551" width="590" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><rect x="900" y="551" width="10" height="100" rx="5" fill="#58788F"/><text x="930" y="585" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#58788F" text-anchor="start">Médiatique</text><text x="930" y="617" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="start"><tspan x="930" dy="0">Le soupçon peut durer même sans infraction établie.</tspan></text><rect x="900" y="663" width="590" height="100" rx="14" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><rect x="900" y="663" width="10" height="100" rx="5" fill="#B07F00"/><text x="930" y="697" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#B07F00" text-anchor="start">Politique</text><text x="930" y="729" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="start"><tspan x="930" dy="0">Confiance et légitimité de la décision peuvent être</tspan><tspan x="930" dy="26">fragilisées.</tspan></text><rect x="90" y="790" width="1420" height="70" rx="16" fill="#EEF4F7" stroke="#DCE3E8"/><circle cx="132" cy="825" r="22" fill="#F8BB00"/><text x="132" y="834" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F4354" text-anchor="middle">!</text><text x="170" y="834" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#2F4354" text-anchor="start">Un même fait peut ouvrir plusieurs fronts : ne réduisez pas l’analyse à une seule conséquence.</text></svg>