<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">DOUTE : ma méthode quand je ne sais pas</title><desc id="desc">Une méthode stable pour traiter les zones grises sans décider seul.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="18" fill="#F8BB00"/><text x="90" y="92" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#2F4354" text-anchor="start">DOUTE : ma méthode quand je ne sais pas</text><text x="90" y="138" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#647583" text-anchor="start">Une méthode stable pour traiter les zones grises sans décider seul.</text><line x1="90" y1="164" x2="1510" y2="164" stroke="#DCE3E8" stroke-width="2"/><line x1="248" y1="350" x2="422" y2="350" stroke="#DCE3E8" stroke-width="5" stroke-dasharray="10 10"/><text x="335.0" y="341" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2F4354" text-anchor="middle">→</text><circle cx="180" cy="350" r="68" fill="#2F4354"/><text x="180" y="373" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">D</text><text x="180" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2F4354" text-anchor="middle">Détecter</text><text x="180" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="180" dy="0">Repérer le signal d’alerte</tspan><tspan x="180" dy="28">ou la situation</tspan><tspan x="180" dy="28">inhabituelle.</tspan></text><line x1="558" y1="350" x2="732" y2="350" stroke="#DCE3E8" stroke-width="5" stroke-dasharray="10 10"/><text x="645.0" y="341" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2F4354" text-anchor="middle">→</text><circle cx="490" cy="350" r="68" fill="#58788F"/><text x="490" y="373" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">O</text><text x="490" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#58788F" text-anchor="middle">Objectiver</text><text x="490" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="490" dy="0">Analyser les faits, les</tspan><tspan x="490" dy="28">liens, le rôle et le</tspan><tspan x="490" dy="28">contexte.</tspan></text><line x1="868" y1="350" x2="1042" y2="350" stroke="#DCE3E8" stroke-width="5" stroke-dasharray="10 10"/><text x="955.0" y="341" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2F4354" text-anchor="middle">→</text><circle cx="800" cy="350" r="68" fill="#B07F00"/><text x="800" y="373" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">U</text><text x="800" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#B07F00" text-anchor="middle">Utiliser</text><text x="800" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="800" dy="0">Mobiliser la bonne</tspan><tspan x="800" dy="28">ressource ou le bon</tspan><tspan x="800" dy="28">interlocuteur.</tspan></text><line x1="1178" y1="350" x2="1352" y2="350" stroke="#DCE3E8" stroke-width="5" stroke-dasharray="10 10"/><text x="1265.0" y="341" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#2F4354" text-anchor="middle">→</text><circle cx="1110" cy="350" r="68" fill="#647583"/><text x="1110" y="373" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">T</text><text x="1110" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#647583" text-anchor="middle">Tracer</text><text x="1110" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="1110" dy="0">Formaliser la démarche et</tspan><tspan x="1110" dy="28">conserver l’avis ou la</tspan><tspan x="1110" dy="28">réponse.</tspan></text><circle cx="1420" cy="350" r="68" fill="#2E7D52"/><text x="1420" y="373" font-family="Arial,Helvetica,sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" text-anchor="middle">E</text><text x="1420" y="465" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2E7D52" text-anchor="middle">Écarter</text><text x="1420" y="505" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle"><tspan x="1420" dy="0">Écarter sa participation</tspan><tspan x="1420" dy="28">si le déport est requis.</tspan></text><rect x="260" y="690" width="1080" height="90" rx="18" fill="#2F4354"/><text x="800" y="745" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">J’AI UN DOUTE  →  JE PASSE EN MODE DOUTE</text><rect x="90" y="790" width="1420" height="70" rx="16" fill="#EEF4F7" stroke="#DCE3E8"/><circle cx="132" cy="825" r="22" fill="#F8BB00"/><text x="132" y="834" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F4354" text-anchor="middle">!</text><text x="170" y="834" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#2F4354" text-anchor="start">Détecter → objectiver → utiliser → tracer → écarter si nécessaire.</text></svg>