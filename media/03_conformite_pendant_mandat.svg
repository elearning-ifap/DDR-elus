<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">La conformité pendant le mandat</title><desc id="desc">Entrée, changement, sortie : trois moments qui déclenchent une vérification.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="18" fill="#F8BB00"/><text x="90" y="92" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#2F4354" text-anchor="start">La conformité pendant le mandat</text><text x="90" y="138" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#647583" text-anchor="start">Entrée, changement, sortie : trois moments qui déclenchent une vérification.</text><line x1="90" y1="164" x2="1510" y2="164" stroke="#DCE3E8" stroke-width="2"/><line x1="270" y1="430" x2="1330" y2="430" stroke="#2F4354" stroke-width="6"/><circle cx="300" cy="430" r="27" fill="#2F4354" stroke="#FFFFFF" stroke-width="6"/><rect x="105" y="230" width="390" height="155" rx="18" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><text x="300" y="274" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2F4354" text-anchor="middle">Entrée dans le mandat</text><text x="300" y="314" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">Recenser les activités et participations</text><text x="300" y="344" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">Compléter les déclarations</text><text x="300" y="374" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">Déposer par le canal officiel</text><circle cx="800" cy="430" r="27" fill="#B07F00" stroke="#FFFFFF" stroke-width="6"/><rect x="605" y="230" width="390" height="155" rx="18" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><text x="800" y="274" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#B07F00" text-anchor="middle">Pendant le mandat</text><text x="800" y="314" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">Une modification substantielle</text><text x="800" y="344" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">déclenche une actualisation</text><circle cx="1300" cy="430" r="27" fill="#2E7D52" stroke="#FFFFFF" stroke-width="6"/><rect x="1105" y="230" width="390" height="155" rx="18" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><text x="1300" y="274" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#2E7D52" text-anchor="middle">Sortie du mandat</text><text x="1300" y="314" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">La fin du mandat déclenche</text><text x="1300" y="344" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#263746" text-anchor="middle">la déclaration de sortie prévue</text><rect x="180" y="520" width="1240" height="205" rx="20" fill="#FFF8E3" stroke="#F1D47D" stroke-width="2"/><text x="220" y="568" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#2F4354" text-anchor="start">Le réflexe opérationnel</text><circle cx="232" cy="607" r="7" fill="#F8BB00"/><text x="252" y="614" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#263746" text-anchor="start">Déclarer à l’entrée.</text><circle cx="232" cy="641" r="7" fill="#F8BB00"/><text x="252" y="648" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#263746" text-anchor="start">Actualiser à chaque changement substantiel.</text><circle cx="232" cy="675" r="7" fill="#F8BB00"/><text x="252" y="682" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#263746" text-anchor="start">Déclarer à la sortie.</text><circle cx="232" cy="709" r="7" fill="#F8BB00"/><text x="252" y="716" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#263746" text-anchor="start">Conserver les justificatifs et traces utiles.</text><rect x="90" y="790" width="1420" height="70" rx="16" fill="#EEF4F7" stroke="#DCE3E8"/><circle cx="132" cy="825" r="22" fill="#F8BB00"/><text x="132" y="834" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F4354" text-anchor="middle">!</text><text x="170" y="834" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#2F4354" text-anchor="start">Les délais et destinataires se vérifient dans la ressource officielle à jour.</text></svg>