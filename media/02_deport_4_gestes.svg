<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Le déport : 4 gestes pour sécuriser sa conduite</title><desc id="desc">Une conduite anticipée, complète et traçable.</desc><rect width="1600" height="900" fill="#FFFFFF"/><rect width="1600" height="18" fill="#F8BB00"/><text x="90" y="92" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#2F4354" text-anchor="start">Le déport : 4 gestes pour sécuriser sa conduite</text><text x="90" y="138" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="400" fill="#647583" text-anchor="start">Une conduite anticipée, complète et traçable.</text><line x1="90" y1="164" x2="1510" y2="164" stroke="#DCE3E8" stroke-width="2"/><rect x="90" y="235" width="337" height="430" rx="22" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><circle cx="138" cy="287" r="28" fill="#2F4354"/><text x="138" y="297" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="182" y="286" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2F4354" text-anchor="start"><tspan x="182" dy="0">Signaler</tspan></text><circle cx="258.5" cy="430" r="70" fill="#EEF4F7" stroke="#2F4354" stroke-width="3"/><text x="258.5" y="451" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="700" fill="#2F4354" text-anchor="middle">!</text><text x="114" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#263746" text-anchor="start"><tspan x="114" dy="0">Porter la situation sensible</tspan><tspan x="114" dy="29">dans le circuit prévu.</tspan></text><text x="439" y="458" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#2F4354" text-anchor="start">→</text><rect x="451" y="235" width="337" height="430" rx="22" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><circle cx="499" cy="287" r="28" fill="#58788F"/><text x="499" y="297" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="543" y="286" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2F4354" text-anchor="start"><tspan x="543" dy="0">Demander conseil</tspan></text><circle cx="619.5" cy="430" r="70" fill="#EEF4F7" stroke="#58788F" stroke-width="3"/><path d="M563 417 q55 -52 110 0 q-55 52 -110 0" fill="none" stroke="#58788F" stroke-width="8"/><circle cx="591" cy="400" r="10" fill="#58788F"/><circle cx="645" cy="400" r="10" fill="#58788F"/><text x="475" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#263746" text-anchor="start"><tspan x="475" dy="0">Faire qualifier la situation</tspan><tspan x="475" dy="29">avant de poursuivre.</tspan></text><text x="800" y="458" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#2F4354" text-anchor="start">→</text><rect x="812" y="235" width="337" height="430" rx="22" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><circle cx="860" cy="287" r="28" fill="#B07F00"/><text x="860" y="297" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="904" y="286" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2F4354" text-anchor="start"><tspan x="904" dy="0">Écarter sa participation</tspan></text><circle cx="980.5" cy="430" r="70" fill="#EEF4F7" stroke="#B07F00" stroke-width="3"/><rect x="957" y="370" width="48" height="115" rx="22" fill="none" stroke="#B07F00" stroke-width="8"/><line x1="942" y1="385" x2="942" y2="350" stroke="#B07F00" stroke-width="7"/><line x1="962" y1="378" x2="962" y2="342" stroke="#B07F00" stroke-width="7"/><line x1="982" y1="376" x2="982" y2="340" stroke="#B07F00" stroke-width="7"/><line x1="1002" y1="378" x2="1002" y2="342" stroke="#B07F00" stroke-width="7"/><line x1="1022" y1="385" x2="1022" y2="350" stroke="#B07F00" stroke-width="7"/><text x="836" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#263746" text-anchor="start"><tspan x="836" dy="0">Lorsque le déport est requis.</tspan></text><text x="1161" y="458" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="700" fill="#2F4354" text-anchor="start">→</text><rect x="1173" y="235" width="337" height="430" rx="22" fill="#FFFFFF" stroke="#DCE3E8" stroke-width="2"/><circle cx="1221" cy="287" r="28" fill="#2E7D52"/><text x="1221" y="297" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="1265" y="286" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2F4354" text-anchor="start"><tspan x="1265" dy="0">Faire conserver une</tspan><tspan x="1265" dy="29">trace</tspan></text><circle cx="1341.5" cy="430" r="70" fill="#EEF4F7" stroke="#2E7D52" stroke-width="3"/><rect x="1283" y="392" width="116" height="82" fill="none" stroke="#2E7D52" stroke-width="7"/><path d="M1301 366 h72 l22 26 h-114 z" fill="none" stroke="#2E7D52" stroke-width="7"/><text x="1197" y="548" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#263746" text-anchor="start"><tspan x="1197" dy="0">Tracer la démarche et la</tspan><tspan x="1197" dy="29">conduite retenue.</tspan></text><rect x="90" y="790" width="1420" height="70" rx="16" fill="#EEF4F7" stroke="#DCE3E8"/><circle cx="132" cy="825" r="22" fill="#F8BB00"/><text x="132" y="834" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#2F4354" text-anchor="middle">!</text><text x="170" y="834" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" fill="#2F4354" text-anchor="start">Repère : un déport se prépare, se déclare et se trace ; il ne s’improvise pas.</text></svg>